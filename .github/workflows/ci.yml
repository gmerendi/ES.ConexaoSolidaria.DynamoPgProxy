name: CI - Lint & Build Check

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

jobs:
  lint-and-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8 - erros críticos apenas)
        run: |
          flake8 pg_dynamo_proxy.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verificar sintaxe (compilação)
        run: python -m py_compile pg_dynamo_proxy.py
